<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIN CITY // 02 cryptic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{--green:#00ff41;--glow:rgba(0,255,65,.5);--bg:#000000;--dim:#0e3a19;--text:#57d97a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;min-height:100vh;overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;
    background-image:radial-gradient(55% 50% at 50% 48%, rgba(0,255,65,.08), transparent 70%);}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:80;
    background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.35) 3px,transparent 4px);mix-blend-mode:multiply}
  a{color:inherit;text-decoration:none}
  .back{position:fixed;top:14px;left:16px;font-size:11px;color:#3f8f56;border:1px solid var(--dim);padding:4px 9px;z-index:90}
  .back:hover{color:var(--green);border-color:var(--green)}
  .center{text-align:center;max-width:560px;width:100%}
  .runes{font-size:11px;letter-spacing:.5em;color:#2e6b40;margin-bottom:26px;opacity:0;animation:fade 2s .2s forwards}
  /* cicada — transparent overlay (black bg stripped, alpha baked from luminance) */
  .cicada{width:clamp(150px,26vw,230px);height:auto;margin:0 auto;display:block;
    filter:drop-shadow(0 0 20px var(--glow));
    animation:pulse 4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.9;filter:drop-shadow(0 0 14px var(--glow))}
    50%{opacity:1;filter:drop-shadow(0 0 32px var(--glow))}}
  .id{margin-top:20px;font-size:13px;letter-spacing:.42em;color:#9effb4}
  .hex{margin-top:16px;font-size:11px;color:#2e6b40;letter-spacing:.14em;word-break:break-all;line-height:1.9;opacity:0;animation:fade 2s .6s forwards}
  .lines{margin-top:26px;font-size:12px;color:#4fbf72;line-height:2;opacity:0;animation:fade 2s 1s forwards}
  .prompt{margin-top:34px;font-size:14px;color:#c9ffd6;opacity:0;animation:fade 1.5s 1.6s forwards}
  .prompt input{background:transparent;border:none;color:var(--green);font:inherit;font-size:14px;outline:none;caret-color:var(--green);width:120px}
  .prompt .lbl{color:#4fbf72}
  .cur{display:inline-block;width:8px;height:15px;background:var(--green);vertical-align:-2px;animation:blink 1.1s steps(1) infinite;box-shadow:0 0 8px var(--glow)}
  @keyframes blink{50%{opacity:0}}
  @keyframes fade{to{opacity:1}}
  .hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.3em;color:#245233}
  .resp{margin-top:18px;font-size:12px;color:var(--green);min-height:18px}
</style>
</head>
<body>
<a class="back" href="./index.html">← candidates</a>
<div class="center">
  <div class="runes">ᛢ ᚨ ᚱ ᚾ ᛁ ᚾ ᚷ &nbsp;·&nbsp; ᛞ ᛟ &nbsp; ᚾ ᛟ ᛏ &nbsp; ᛏ ᚱ ᚢ ᛊ ᛏ</div>

  <img class="cicada" src="./cicada.webp" alt="cicada" />

  <div class="id">3 3 0 1</div>

  <div class="hex">937431cda0c3 · da2c575e48ee · b30289fee7d7<br/>the primes remember what the flesh forgets</div>

  <div class="lines">
    ever have that feeling where you're not sure if you're awake or dreaming?
  </div>

  <div class="prompt">
    <span class="lbl">seeker@sin.city:~$ </span><input id="cmd" autofocus autocomplete="off" spellcheck="false" placeholder="begin" /><span class="cur"></span>
    <div class="resp" id="resp"></div>
  </div>
</div>
<div class="hint">TYPE  ·  BEGIN  ·  TO  ·  DESCEND</div>
<script>
  const cmd = document.getElementById('cmd');
  const resp = document.getElementById('resp');
  const msgs = {
    begin:"> the door opens. 4 posts await in the dark. [demo]",
    help:"> there is no help. there is only the process.",
    who:"> we are the ones who count in primes.",
    "3301":"> welcome, seeker.",
  };
  cmd.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const v = cmd.value.trim().toLowerCase();
      resp.textContent = msgs[v] || "> the cicada is silent. try 'begin'.";
      cmd.value='';
    }
  });
</script>
</body>
</html>
